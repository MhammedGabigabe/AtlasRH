services:
  db:
    image: postgres:16-alpine
    container_name: atlasrh-db
    environment:
      POSTGRES_DB: atlasrh
      POSTGRES_USER: atlasrh
      POSTGRES_PASSWORD: atlasrh
    ports:
      - "5432:5432"
    volumes:
      - atlasrh-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlasrh -d atlasrh"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: atlasrh-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/atlasrh
      DB_USER: atlasrh
      DB_PASSWORD: atlasrh
    ports:
      - "8080:8080"

volumes:
  atlasrh-db-data:
