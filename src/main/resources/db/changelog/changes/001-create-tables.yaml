databaseChangeLog:

  # ---------------------------------------------------------------
  # Table department
  # ---------------------------------------------------------------
  - changeSet:
      id: 001-01-create-department
      author: gabi
      changes:
        - createTable:
            tableName: department
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_department
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
        - addUniqueConstraint:
            tableName: department
            columnNames: name
            constraintName: uk_department_name

  # ---------------------------------------------------------------
  # Table employee
  # ---------------------------------------------------------------
  - changeSet:
      id: 001-02-create-employee
      author: gabi
      changes:
        - createTable:
            tableName: employee
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_employee
                    nullable: false
              - column:
                  name: matricule
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: position
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: hire_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: department_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: manager_id
                  type: BIGINT
        - addUniqueConstraint:
            tableName: employee
            columnNames: matricule
            constraintName: uk_employee_matricule
        - addUniqueConstraint:
            tableName: employee
            columnNames: email
            constraintName: uk_employee_email
        - addForeignKeyConstraint:
            baseTableName: employee
            baseColumnNames: department_id
            referencedTableName: department
            referencedColumnNames: id
            constraintName: fk_employee_department
        - addForeignKeyConstraint:
            baseTableName: employee
            baseColumnNames: manager_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_employee_manager

  # ---------------------------------------------------------------
  # Table contract
  # ---------------------------------------------------------------
  - changeSet:
      id: 001-03-create-contract
      author: gabi
      changes:
        - createTable:
            tableName: contract
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_contract
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
              - column:
                  name: gross_salary
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: contract
            baseColumnNames: employee_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_contract_employee

  # ---------------------------------------------------------------
  # Table leave_type
  # ---------------------------------------------------------------
  - changeSet:
      id: 001-04-create-leave-type
      author: gabi
      changes:
        - createTable:
            tableName: leave_type
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_leave_type
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: days_per_year
                  type: INT
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: leave_type
            columnNames: name
            constraintName: uk_leave_type_name

  # ---------------------------------------------------------------
  # Table leave_request
  # ---------------------------------------------------------------
  - changeSet:
      id: 001-05-create-leave-request
      author: gabi
      changes:
        - createTable:
            tableName: leave_request
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_leave_request
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: number_of_days
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: manager_comment
                  type: VARCHAR(500)
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: leave_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: leave_request
            baseColumnNames: employee_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_leave_request_employee
        - addForeignKeyConstraint:
            baseTableName: leave_request
            baseColumnNames: leave_type_id
            referencedTableName: leave_type
            referencedColumnNames: id
            constraintName: fk_leave_request_leave_type
