  # ---------------------------------------------------------------
  # Données de démonstration : contrats
  # EMP004 illustre un historique CDD TERMINE puis CDI EN_COURS.
  # EMP008 illustre un STAGE EN_COURS avec date de fin.
  # ---------------------------------------------------------------
  - changeSet:
      id: 002-04-insert-contracts
      author: gabi
      changes:
        - sql:
            sql: |
              INSERT INTO contract (type, start_date, end_date, gross_salary, status, employee_id)
              SELECT 'CDI', DATE '2018-03-01', NULL, 48000.00, 'EN_COURS', id
              FROM employee WHERE matricule = 'EMP001';

              INSERT INTO contract (type, start_date, end_date, gross_salary, status, employee_id)
              SELECT 'CDI', DATE '2018-06-15', NULL, 45000.00, 'EN_COURS', id
              FROM employee WHERE matricule = 'EMP002';

              INSERT INTO contract (type, start_date, end_date, gross_salary, status, employee_id)
              SELECT 'CDI', DATE '2019-01-10', NULL, 46000.00, 'EN_COURS', id
              FROM employee WHERE matricule = 'EMP003';

              INSERT INTO contract (type, start_date, end_date, gross_salary, status, employee_id)
              SELECT 'CDD', DATE '2020-02-01', DATE '2021-12-31', 18000.00, 'TERMINE', id
              FROM employee WHERE matricule = 'EMP004';

              INSERT INTO contract (type, start_date, end_date, gross_salary, status, employee_id)
              SELECT 'CDI', DATE '2022-01-01', NULL, 26000.00, 'EN_COURS', id
              FROM employee WHERE matricule = 'EMP004';

              INSERT INTO contract (type, start_date, end_date, gross_salary, status, employee_id)
              SELECT 'CDI', DATE '2022-09-01', NULL, 22000.00, 'EN_COURS', id
              FROM employee WHERE matricule = 'EMP005';

              INSERT INTO contract (type, start_date, end_date, gross_salary, status, employee_id)
              SELECT 'CDI', DATE '2021-04-12', NULL, 25000.00, 'EN_COURS', id
              FROM employee WHERE matricule = 'EMP006';

              INSERT INTO contract (type, start_date, end_date, gross_salary, status, employee_id)
              SELECT 'CDI', DATE '2023-10-02', NULL, 24000.00, 'EN_COURS', id
              FROM employee WHERE matricule = 'EMP007';

              INSERT INTO contract (type, start_date, end_date, gross_salary, status, employee_id)
              SELECT 'STAGE', DATE '2026-09-01', DATE '2027-02-28', 3000.00, 'EN_COURS', id
              FROM employee WHERE matricule = 'EMP008';

  # ---------------------------------------------------------------
  # Données de démonstration : types de congé
  # ---------------------------------------------------------------
  - changeSet:
      id: 002-05-insert-leave-types
      author: gabi
      changes:
        - sql:
            sql: |
              INSERT INTO leave_type (name, days_per_year) VALUES
                ('ANNUEL', 18),
                ('EXCEPTIONNEL', 3);
