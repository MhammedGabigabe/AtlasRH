databaseChangeLog:

  # ---------------------------------------------------------------
  # Données de démonstration : départements
  # ---------------------------------------------------------------
  - changeSet:
      id: 002-01-insert-departments
      author: gabi
      changes:
        - sql:
            sql: |
              INSERT INTO department (name, description) VALUES
                ('Ressources Humaines', 'Gestion du personnel, du recrutement et des carrières.'),
                ('Informatique', 'Développement, infrastructure et support informatique.'),
                ('Finance', 'Comptabilité, budget et contrôle de gestion.');

  # ---------------------------------------------------------------
  # Données de démonstration : managers (sans manager)
  # ---------------------------------------------------------------
  - changeSet:
      id: 002-02-insert-managers
      author: gabi
      changes:
        - sql:
            sql: |
              INSERT INTO employee (matricule, last_name, first_name, email, position, hire_date, department_id, manager_id) VALUES
                ('EMP001', 'El Amrani', 'Yassine', 'yassine.elamrani@atlasrh.ma', 'Directeur des Ressources Humaines',
                 DATE '2018-03-01', (SELECT id FROM department WHERE name = 'Ressources Humaines'), NULL),
                ('EMP002', 'Benali', 'Salma', 'salma.benali@atlasrh.ma', 'Directrice Informatique',
                 DATE '2018-06-15', (SELECT id FROM department WHERE name = 'Informatique'), NULL),
                ('EMP003', 'Tazi', 'Karim', 'karim.tazi@atlasrh.ma', 'Directeur Financier',
                 DATE '2019-01-10', (SELECT id FROM department WHERE name = 'Finance'), NULL);

  # ---------------------------------------------------------------
  # Données de démonstration : employés rattachés à un manager
  # ---------------------------------------------------------------
  - changeSet:
      id: 002-03-insert-employees
      author: gabi
      changes:
        - sql:
            sql: |
              INSERT INTO employee (matricule, last_name, first_name, email, position, hire_date, department_id, manager_id) VALUES
                ('EMP004', 'Chraibi', 'Nadia', 'nadia.chraibi@atlasrh.ma', 'Chargée de recrutement',
                 DATE '2020-02-01', (SELECT id FROM department WHERE name = 'Ressources Humaines'),
                 (SELECT id FROM employee WHERE matricule = 'EMP001')),
                ('EMP005', 'Idrissi', 'Omar', 'omar.idrissi@atlasrh.ma', 'Gestionnaire de paie',
                 DATE '2022-09-01', (SELECT id FROM department WHERE name = 'Ressources Humaines'),
                 (SELECT id FROM employee WHERE matricule = 'EMP001')),
                ('EMP006', 'Fassi', 'Leila', 'leila.fassi@atlasrh.ma', 'Développeuse Java',
                 DATE '2021-04-12', (SELECT id FROM department WHERE name = 'Informatique'),
                 (SELECT id FROM employee WHERE matricule = 'EMP002')),
                ('EMP007', 'Ouazzani', 'Mehdi', 'mehdi.ouazzani@atlasrh.ma', 'Administrateur système',
